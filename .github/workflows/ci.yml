name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test
      - run: make smoke
      - name: Build release binaries
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p dist
          case '${{ runner.os }}' in
            Linux) target=linux ;;
            macOS) target=darwin ;;
          esac
          for arch in amd64 arm64; do
            asset="diffplay-$target-$arch"
            CGO_ENABLED=0 GOOS="$target" GOARCH="$arch" go build -trimpath -ldflags='-s -w' -o "dist/$asset" .
            (cd dist && shasum -a 256 "$asset" > "$asset.sha256")
          done
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        with:
          name: binaries-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes --latest
          fi
